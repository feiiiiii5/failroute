name: Release

on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # PyPI Trusted Publishing (OIDC, no long-lived token)
      contents: write   # create the GitHub release with changelog notes
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
      - name: Create GitHub release from CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/release_notes.py > release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "failroute $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            || echo "release already exists; skipped"
