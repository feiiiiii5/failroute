name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        # setup-python has no CPython 3.9 build for Ubuntu 26.04.
        # Keep the supported-version test on the compatible 24.04 image.
        exclude:
          - os: ubuntu-latest
            python-version: "3.9"
        include:
          - os: ubuntu-24.04
            python-version: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - run: pytest

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]" ruff mypy pytest-cov
      - run: ruff check .
      - run: mypy src/failroute
      - run: pytest --cov=failroute --cov-fail-under=88
      - run: failroute --repo . --quiet --exclude tests/corpus --exclude paper/j1-trulens2653-prefix.py
      - run: python tools/benchmark.py --json
