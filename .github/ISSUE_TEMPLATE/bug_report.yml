name: Bug report
description: A wrong finding, a missed pattern, or a crash.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Expected vs actual finding (or crash traceback).
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest Python snippet (or file) that shows the problem.
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: failroute version
      description: Output of `failroute --version`.
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version and OS
