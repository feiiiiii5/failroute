[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "failroute"
version = "0.7.0"
description = "Static detection of failure-routing anti-patterns in Python"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "fc" }]
keywords = ["static-analysis", "exception-handling", "code-quality", "llm", "reliability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/feiiiiii5/failroute"
Changelog = "https://github.com/feiiiiii5/failroute/blob/main/CHANGELOG.md"
Issues = "https://github.com/feiiiiii5/failroute/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
failroute = "failroute.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py39"
line-length = 110
extend-exclude = ["tests/corpus"]  # intentionally-invalid fixtures

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Corpus fixtures are intentionally synthetic snippets with undefined names.
"tests/corpus/*" = ["F821", "B017"]

# tools/ holds one-off analysis and benchmark scripts that produce the numbers in
# paper/. They are kept exactly as they were run, so that the published figures stay
# traceable to executed code; reformatting them for style would break that link for
# no correctness gain. Only cosmetic rules are relaxed -- E (except E501/E70x/E741),
# F, B, I and the correctness-relevant UP rules still apply, and src/ and tests/ are
# held to the full rule set.
"tools/*" = [
    "E501",   # long lines in tabular print statements
    "E701",   # `if x: y` on one line
    "E702",   # `a = 1; b = 2` on one line
    "E741",   # `l` as a loop variable
    "UP031",  # printf-style % formatting
    "B007",   # unused loop control variable
    "E402",   # imports after a sys.path tweak
    "F841",   # assigned-and-unused, kept for readability at a debug point
]

[tool.mypy]
strict = true

[tool.coverage.run]
omit = ["src/failroute/__main__.py"]

[tool.coverage.report]
omit = ["src/failroute/__main__.py"]